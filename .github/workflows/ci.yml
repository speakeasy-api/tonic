name: CI

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Check for release
        id: release
        run: |
          # Get the last release tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            # No tags yet, check all commits
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            # Check commits since last tag
            COMMITS=$(git log --pretty=format:"%s" ${LAST_TAG}..HEAD)
          fi

          # Skip if no commits to analyze
          if [ -z "$COMMITS" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine version bump based on conventional commits
          BUMP=""

          # Check for breaking changes
          if echo "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE:"; then
            BUMP="major"
          # Check for features
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          # Check for fixes
          elif echo "$COMMITS" | grep -qE "^fix(\(.+\))?:"; then
            BUMP="patch"
          fi

          if [ -z "$BUMP" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            if [ -n "$LAST_TAG" ]; then
              BASE_VERSION=${LAST_TAG#v}
            else
              BASE_VERSION=$(node -p "require('./packages/tonic/package.json').version")
            fi

            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

            case "$BUMP" in
              major)
                VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                VERSION="${MAJOR}.$((MINOR + 1)).0"
                ;;
              patch)
                VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
              *)
                echo "unsupported bump: $BUMP" >&2
                exit 1
                ;;
            esac

            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "bump=$BUMP" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and publish
        if: steps.release.outputs.should_release == 'true'
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Install cargo release tooling
          if ! cargo --list | grep -q '^[[:space:]]*set-version$'; then
            cargo install cargo-edit --version 0.13.9 --locked
          fi

          # Bump version
          VERSION=${{ steps.release.outputs.version }}
          npm version "$VERSION" --no-git-tag-version --prefix packages/tonic
          cargo set-version --workspace "$VERSION"

          # Verify publish payloads before pushing tags
          bun run release:all:dry-run

          # TODO: Replace with `bun publish` when OIDC is supported
          bun run release:rust
          npm publish ./packages/tonic

          # Commit and tag
          git add Cargo.toml Cargo.lock packages/tonic/package.json
          git commit -m "chore: release v${VERSION} [skip ci]"
          git tag "v${VERSION}"

          # Push changes
          git push
          git push --tags
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
